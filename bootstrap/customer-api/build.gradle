plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.commerce.customer'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 내부 모듈 의존성
    implementation project(':customer-core')
    implementation project(':persistence')
    implementation project(':kafka')
    implementation project(':common')

    // Spring Boot Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.kafka:spring-kafka'
    
    
    // API 문서화
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'
    
    // JSON 처리
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // 테스트 의존성
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mariadb'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'com.h2database:h2'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.0"
    }
}

// 단위 테스트 설정
tasks.named('test') {
    useJUnitPlatform {
        // 통합테스트 제외
        excludeTags 'integration'
    }
    // 통합테스트 파일 제외
    exclude '**/*IntegrationTest.class'
}

// 통합테스트 전용 태스크
task integrationTest(type: Test) {
    description = 'Runs integration tests using TestContainers'
    group = 'verification'

    useJUnitPlatform {
        includeTags 'integration'
    }

    // 통합테스트 파일만 포함
    include '**/*IntegrationTest.class'

    // 통합테스트는 단위 테스트보다 더 많은 메모리와 시간이 필요
    maxHeapSize = '2048m'

    // 테스트 결과를 별도 디렉토리에 저장
    reports {
        html.outputLocation = layout.buildDirectory.dir('reports/integration-tests')
        junitXml.outputLocation = layout.buildDirectory.dir('test-results/integration-test')
    }

    // 테스트 진행 상황 출력
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }

    // 통합테스트는 병렬 실행하지 않음 (TestContainers 충돌 방지)
    maxParallelForks = 1

    // 필요한 경우 특정 프로파일 활성화
    systemProperty 'spring.profiles.active', 'integration'
}

// check 태스크가 통합테스트도 실행하도록 설정
check.dependsOn integrationTest